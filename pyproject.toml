[tool.poetry]
name = "medvoice-workspace"
version = "0.1.0"
description = "Workspace wrapper for MedVoice frontend/backend split."
packages = [{ include = "medvoice_workspace" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

[tool.poetry.scripts]
uvicorn = "medvoice_workspace.commands:uvicorn_proxy"
backend-dev = "medvoice_workspace.commands:backend_dev"
backend-test = "medvoice_workspace.commands:backend_test"
backend-migrate = "medvoice_workspace.commands:backend_migrate"
