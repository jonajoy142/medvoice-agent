services:
  postgres:
    image: postgres:16-alpine
    container_name: medvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medvoice}
      POSTGRES_DB: ${POSTGRES_DB:-medvoice}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medvoice} -d ${POSTGRES_DB:-medvoice}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
